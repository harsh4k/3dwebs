<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Auralis">
  <!--
    The Auralis mark: the scene's glyph — two crossed bars — flattened to a wordless monogram.
    Proportions follow `sceneConfig.glyph` (barLength 14 : barWidth 2.6 ≈ 5.4 : 1), so the icon and
    the 3D hero read as the same shape. Black field, white mark, no gradients: it has to survive at
    16px in a browser tab.
  -->
  <rect width="512" height="512" fill="#000000" />
  <g transform="translate(256 256)" fill="#ffffff">
    <rect x="-150" y="-27.5" width="300" height="55" rx="4" transform="rotate(45)" />
    <rect x="-150" y="-27.5" width="300" height="55" rx="4" transform="rotate(-45)" />
  </g>
</svg>
